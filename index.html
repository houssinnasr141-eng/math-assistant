
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head <link rel="icon" type="image/png" href="math-ai-logo.png">>
    <meta name="google-site-verification" content="TG9xWDJdcz7mBLyU8aO88COJNal7o5EZq8_Ptm7pCxA">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Math AI - Assistant de mathématiques</title>
    <meta name="description" content="Résolvez des équations, factorisez et développez des expressions mathématiques étape par étape.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        h1, .subtitle {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .calculator {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 16px;
        }

        .tabs, .buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px;
            margin: 18px 0;
        }

        button {
            padding: 12px 8px;
            border: 0;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 15px;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        button:hover {
            background: #475569;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 2px;
        }

        button.active, .primary {
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        label {
            display: block;
            margin: 14px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 17px;
            direction: ltr;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .primary {
            width: 100%;
            margin-top: 15px;
        }

        .result {
            display: none;
            margin-top: 22px;
            padding: 17px;
            border-radius: 10px;
            background: #0f172a;
            overflow-wrap: anywhere;
        }

        .result.show {
            display: block;
        }

        .answer {
            margin: 12px 0;
            color: #93c5fd;
            font-size: 23px;
            overflow-wrap: anywhere;
            direction: ltr;
            text-align: left;
        }

        #steps {
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #steps p {
            margin: 8px 0;
        }

        .hint {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.7;
        }

        .status {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 10px;
            }

            .calculator {
                padding: 17px;
            }

            .tabs, .buttons {
                gap: 6px;
            }

            button {
                font-size: 13px;
                padding: 11px 5px;
            }
        }
    </style.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 10px;
}

.brand img {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.brand h1 {
    margin: 0;
}>
</head>

<body>
    <div class="brand">
    <img src="math-ai-logo.png" alt="Logo Math AI">
    <h1>Math AI</h1>
</div>

    <p class="subtitle">
        Votre assistant pour comprendre les mathématiques
    </p>

    <main class="calculator">
        <h2>Calcul mathématique</h2>

        <div class="tabs" role="group" aria-label="Outils mathématiques">
            <button type="button" class="active" data-mode="equation">
                Résoudre une équation
            </button>

            <button type="button" data-mode="factor">
                Factoriser
            </button>

            <button type="button" data-mode="expand">
                Développer
            </button>
        </div>

        <section id="equationFields">
            <label for="leftExpr">Membre de gauche</label>
            <input
                id="leftExpr"
                type="text"
                placeholder="Saisissez le membre de gauche"
                autocomplete="off"
                spellcheck="false"
            >

            <label for="rightExpr">Membre de droite</label>
            <input
                id="rightExpr"
                type="text"
                placeholder="Saisissez le membre de droite"
                autocomplete="off"
                spellcheck="false"
            >
        </section>

        <section id="expressionFields" hidden>
            <label for="expression">Expression mathématique</label>
            <input
                id="expression"
                type="text"
                placeholder="Saisissez une expression"
                autocomplete="off"
                spellcheck="false"
            >
        </section>

        <div class="buttons" aria-label="Clavier mathématique">
            <button type="button" data-insert="sqrt(">√</button>
            <button type="button" data-insert="^2">x²</button>
            <button type="button" data-insert="x">x</button>
            <button type="button" data-insert="+">+</button>
            <button type="button" data-insert="-">−</button>
            <button type="button" data-insert="*">×</button>
            <button type="button" data-insert="/">÷</button>
            <button type="button" data-insert="(">(</button>
            <button type="button" data-insert=")">)</button>
        </div>

        <button type="button" class="primary" id="calculateBtn">
            Calculer
        </button>

        <p class="hint">
            Utilisez * pour la multiplication, ^ pour les puissances
            et sqrt(25) pour la racine carrée.
            Exemple : 5*x ou x^2 - 9.
        </p>

        <section id="result" class="result" aria-live="polite">
            <h3 id="resultTitle">Résultat</h3>
            <div id="answer" class="answer"></div>
            <div id="steps"></div>
        </section>

        <p id="status" class="status" role="status"></p>
    </main>

    <script>
        "use strict";

        const API_URL =
            "https://math-assistant-api.onrender.com/api/calculate";

        let mode = "equation";
        let lastFocusedInput = null;

        const tabs = document.querySelectorAll("[data-mode]");
        const leftInput = document.getElementById("leftExpr");
        const rightInput = document.getElementById("rightExpr");
        const expressionInput = document.getElementById("expression");
        const equationFields = document.getElementById("equationFields");
        const expressionFields = document.getElementById("expressionFields");
        const resultBox = document.getElementById("result");
        const resultTitle = document.getElementById("resultTitle");
        const answerBox = document.getElementById("answer");
        const stepsBox = document.getElementById("steps");
        const statusBox = document.getElementById("status");
        const calculateBtn = document.getElementById("calculateBtn");

        const modeLabels = {
            equation: "Calculer",
            factor: "Factoriser l'expression",
            expand: "Développer l'expression"
        };

        function hideResult() {
            resultBox.classList.remove("show");
            answerBox.textContent = "";
            stepsBox.replaceChildren();
            statusBox.textContent = "";
        }

        function setMode(newMode) {
            mode = newMode;

            tabs.forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.mode === mode
                );
            });

            equationFields.hidden = mode !== "equation";
            expressionFields.hidden = mode === "equation";

            calculateBtn.textContent = modeLabels[mode];

            hideResult();

            // Ne remplit aucune expression automatiquement.
        }

        tabs.forEach(button => {
            button.addEventListener("click", () => {
                setMode(button.dataset.mode);
            });
        });

        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("focus", () => {
                lastFocusedInput = input;
            });

            input.addEventListener("input", hideResult);
        });

        function getActiveInput() {
            if (
                lastFocusedInput &&
                !lastFocusedInput.closest("[hidden]") &&
                document.activeElement === lastFocusedInput
            ) {
                return lastFocusedInput;
            }

            if (mode === "equation") {
                return leftInput;
            }

            return expressionInput;
        }

        function insertText(text) {
            const input = getActiveInput();

            if (!input) {
                return;
            }

            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? input.value.length;

            input.setRangeText(text, start, end, "end");
            input.focus();
            lastFocusedInput = input;
            hideResult();
        }

        document.querySelectorAll("[data-insert]").forEach(button => {
            button.addEventListener("click", () => {
                insertText(button.dataset.insert);
            });
        });

        function showSteps(steps) {
            stepsBox.replaceChildren();

            if (!Array.isArray(steps)) {
                return;
            }

            steps.forEach(step => {
                const line = document.createElement("p");
                line.textContent = String(step);
                stepsBox.appendChild(line);
            });
        }

        async function calculate() {
            hideResult();

            let data;

            if (mode === "equation") {
                const left = leftInput.value.trim();
                const right = rightInput.value.trim();

                if (!left || !right) {
                    statusBox.textContent =
                        "Veuillez remplir les deux membres de l'équation.";
                    return;
                }

                data = {
                    mode: "equation",
                    left: left,
                    right: right
                };
            } else {
                const expression = expressionInput.value.trim();

                if (!expression) {
                    statusBox.textContent =
                        "Veuillez saisir une expression mathématique.";
                    return;
                }

                data = {
                    mode: mode,
                    expression: expression
                };
            }

            calculateBtn.disabled = true;
            resultBox.classList.add("show");
            resultTitle.textContent = "Résultat";
            answerBox.textContent = "Calcul en cours...";
            statusBox.textContent = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                let result;

                try {
                    result = await response.json();
                } catch {
                    throw new Error(
                        "Le serveur a renvoyé une réponse invalide."
                    );
                }

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.error || "Une erreur est survenue."
                    );
                }

                resultTitle.textContent = result.title || "Résultat";

                if (Array.isArray(result.answer)) {
                    answerBox.textContent = result.answer.length
                        ? result.answer.map(s => "x = " + s).join(" ; ")
                        : "Aucune solution trouvée.";
                } else {
                    answerBox.textContent = String(result.answer ?? "");
                }

                showSteps(result.steps);
            } catch (error) {
                resultTitle.textContent = "Erreur";
                answerBox.textContent = "Calcul impossible.";
                stepsBox.replaceChildren();

                const message = document.createElement("p");
                message.textContent =
                    error.message ||
                    "Impossible de contacter le serveur.";

                stepsBox.appendChild(message);
            } finally {
                calculateBtn.disabled = false;
            }
        }

        calculateBtn.addEventListener("click", calculate);

        // Le site s'ouvre avec des champs vides et sans calcul automatique.
    </script>
</body>
</html>
